services:
  php:
    build:
      context: ./
      dockerfile: ./docker/php/Dockerfile
      target: php-fpm
    expose:
      - "9000"
    volumes:
      - ./projects:/var/www/projects
      - ./project_docker_files:/var/www/project_docker_files
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  postgresql:
    driver: local
